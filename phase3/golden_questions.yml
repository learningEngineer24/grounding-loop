  expected_behavior: answer_with_disclosure
  trap:
    naive: "SUM(amount) over all payments — and call it revenue."
    why_wrong: "'Money processed' is not a governed metric, and it is not revenue (Quirk 4). The layer must not bless it as such."
    disclosure: "No governed 'money processed' metric. Closest governed answers: total_payments (3,000 attempts) and settled_revenue. Reported both, labeled."

- id: Q112
