# Grounding Loop — Phase 3 golden dataset (v1)
# 167 questions against semantics_v1.yml. Every question records what the
# governed layer should do: the metric, the cut, the definition version —
# and, for traps, what the naive answer gets wrong.
#
# Categories:
#   straightforward — direct metric lookup, possibly cut by time/status/segment
#   trap            — a reasonable person (or bare LLM SQL) gets it wrong;
#                     the governed definition gets it right
#   ambiguous       — underspecified or adversarial; the right move is to
#                     clarify, refuse, or answer-with-disclosure
#
# Fields:
#   metric, dimensions, grain, period: how compute_answers.py derives the
#     expected value through the semantic compiler (never hand-written SQL).
#   period: one of H1 | Q1 | Q2 | YYYY-MM, applied to the time dimension rows.
#   expected_behavior: answer | clarify | refuse | answer_with_disclosure
#   trap: for traps — the naive interpretation and why it's wrong.

definition_version: 1
warehouse: "warehouse.duckdb"
generated_by: "phase3/compute_answers.py (values locked, do not hand-edit)"

