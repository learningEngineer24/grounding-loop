# ---------------------------------------------------------------- trap (12)

- id: Q101
  category: trap
  question: "What was our revenue in Q1 2026?"
  metric: settled_revenue
  dimensions: [payment_date]
  grain: month
  period: Q1
  expected_behavior: answer_with_disclosure
  trap:
    naive: "SUM(payments.amount) over Q1 — every status counted as revenue."
    why_wrong: "Quirk 4: only status='settled' is revenue. The naive sum overstates by ~20% (pending, failed, chargeback, voided, refunded)."
    disclosure: "Answered as settled_revenue (governed). If you meant gross order revenue, ask for gross_revenue."

- id: Q102
  category: trap
  question: "What was net revenue in March 2026?"
  metric: net_realized_revenue
  grain: month
  period: "2026-03"
  expected_behavior: answer_with_disclosure
  trap:
    naive: "Match each March refund back to its original payment month and net there."
    why_wrong: "Quirk 1: refunds are dated when they happen, days/weeks after payment. Governed monthly net = settled revenue booked in March minus refunds issued in March."
    disclosure: "Monthly netting follows event dates, not original order months."
  notes: "Derived metric; computed from settled_revenue (payment month) and total_refunds (refund month)."

- id: Q103
  category: trap
  question: "How many active customers placed orders in H1 2026?"
  metric: active_customers
  expected_behavior: answer_with_disclosure
  trap:
    naive: "COUNT(DISTINCT customer_id) over orders."
    why_wrong: "Quirk 2: trial accounts can place orders. The naive count mixes trials into 'active'. Governed active_customers = paid accounts only."
    disclosure: "Answered as governed active_customers (paid accounts). Customers-with-orders is a different, ungoverned cut."

- id: Q104
  category: trap
  question: "How much did we refund in H1 2026, counting each refunded payment in full?"
  metric: total_refunds
  expected_behavior: answer_with_disclosure
  trap:
    naive: "SUM(payments.amount) WHERE status='refunded' — full payment amounts."
    why_wrong: "Quirk 1: 30% of refunds are partial. Governed total_refunds sums actual refund_amount, not the original payment."
    disclosure: "Answered as governed total_refunds (actual refunded dollars). Full-payment netting is not the governed definition."

- id: Q105
  category: trap
  question: "What is average order value, excluding the free add-on orders?"
  metric: avg_order_value
  expected_behavior: answer_with_disclosure
  trap:
    naive: "Recompute AOV over revenue-bearing orders only."
    why_wrong: "Quirk 6: the governed avg_order_value deliberately includes $0 free-addon orders in the denominator. Excluding them is a different metric."
    disclosure: "Answered as governed avg_order_value (free add-ons included). The ex-free-addon variant is not governed."

- id: Q106
  category: trap
  question: "What was revenue in H1 2026?"
  metric: net_realized_revenue
  expected_behavior: answer_with_disclosure
  trap:
    naive: "Pick gross_revenue — the biggest, most headline number."
    why_wrong: "Quirks 4+7: 'revenue' without qualification. The governed true top line is net_realized_revenue (settled minus actual refunds). Gross ignores discounts and unrealized payments."
    disclosure: "Answered as net_realized_revenue. Also available: gross_revenue, net_order_value, settled_revenue — ask by name."

- id: Q107
  category: trap
  question: "What is churn rate among active customers?"
  metric: churn_rate
  expected_behavior: answer_with_disclosure
  trap:
    naive: "cancelled / active_customers."
    why_wrong: "Quirk 5 + v1 simplification: governed churn_rate = cancelled / total_customers. The 'among active' variant is not the governed definition."
    disclosure: "Answered as governed churn_rate (cancelled over all customers, v1 simplification)."

- id: Q108
  category: trap
  question: "What was revenue in H1 2026, including pending settlements?"
  metric: settled_revenue
  expected_behavior: answer_with_disclosure
  trap:
    naive: "SUM(amount) WHERE status IN ('settled','pending_settlement')."
    why_wrong: "Quirk 4: pending_settlement is not realized revenue. The governed definition excludes it; redefining revenue per-question defeats governance."
    disclosure: "Answered as governed settled_revenue (pending excluded). Pending volume is not a governed metric."

