- id: Q101
  category: trap
  question: "What was our revenue in Q1 2026?"
  metric: settled_revenue
  dimensions: [payment_date]
  grain: month
  period: Q1
  expected_behavior: answer_with_disclosure
  trap:
    naive: "SUM(payments.amount) over Q1 — every status counted as revenue."
    why_wrong: "Quirk 4: only status='settled' is revenue. The naive sum overstates by ~20% (pending, failed, chargeback, voided, refunded)."
    disclosure: "Answered as settled_revenue (governed). If you meant gross order revenue, ask for gross_revenue."

- id: Q102
  category: trap
  question: "What was net revenue in March 2026?"
  metric: net_realized_revenue
  grain: month
  period: "2026-03"
  expected_behavior: answer_with_disclosure
  trap:
    naive: "Match each March refund back to its original payment month and net there."
    why_wrong: "Quirk 1: refunds are dated when they happen, days/weeks after payment. Governed monthly net = settled revenue booked in March minus refunds issued in March."
    disclosure: "Monthly netting follows event dates, not original order months."
  notes: "Derived metric; computed from settled_revenue (payment month) and total_refunds (refund month)."

- id: Q103
  category: trap
  question: "How many active customers placed orders in H1 2026?"
  metric: active_customers
  expected_behavior: answer_with_disclosure
  trap:
    naive: "COUNT(DISTINCT customer_id) over orders."
    why_wrong: "Quirk 2: trial accounts can place orders. The naive count mixes trials into 'active'. Governed active_customers = paid accounts only."
    disclosure: "Answered as governed active_customers (paid accounts). Customers-with-orders is a different, ungoverned cut."

