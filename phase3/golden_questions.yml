  expected_behavior: answer_with_disclosure
  trap:
    naive: "Expect a multi-row breakdown with revenue attributed per status."
    why_wrong: "settled_revenue filters to status='settled' — the breakdown is a single row. The question reveals a misunderstanding of the filter."
    disclosure: "Single row (settled). For counts by status, use total_payments."

